{% extends 'base.html' %}

{% block title %}Login - BrainDump{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <!-- Login heading -->
    <h1 class="text-3xl sm:text-4xl font-black mb-6 sm:mb-8 text-center bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">
        Login to BrainDump
    </h1>

    <!-- Login form -->
    <form method="post" class="space-y-4 sm:space-y-6">
        {% csrf_token %}

        <!-- Username field -->
        <div>
            <label class="block text-gray-700 font-bold mb-2 text-sm sm:text-base">Username</label>
            <input type="text" name="username" required
                   class="w-full px-3 sm:px-4 py-2 sm:py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none text-sm sm:text-base">
        </div>

        <!-- Password field -->
        <div>
            <label class="block text-gray-700 font-bold mb-2 text-sm sm:text-base">Password</label>
            <input type="password" name="password" required
                   class="w-full px-3 sm:px-4 py-2 sm:py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none text-sm sm:text-base">
        </div>

        <!-- Submit button -->
        <button type="submit"
                class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 sm:px-8 py-3 sm:py-4 rounded-lg font-black text-base sm:text-lg hover:shadow-lg transition transform hover:-translate-y-0.5">
            Login
        </button>
    </form>

    <!-- Register link -->
    <p class="text-center mt-4 sm:mt-6 text-gray-600 text-sm sm:text-base">
        Don't have an account? <a href="{% url 'register' %}" class="text-purple-500 font-bold hover:text-purple-700">Register here</a>
    </p>
</div>
{% endblock %}
