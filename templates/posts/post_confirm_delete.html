{% extends 'base.html' %}

{% block title %}Delete Post - BrainDump{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto text-center">
    <!-- Warning heading -->
    <h1 class="text-4xl font-black mb-8 text-red-500">⚠️ Delete Post?</h1>

    <!-- Confirmation message -->
    <div class="bg-red-50 border-2 border-red-200 p-8 rounded-xl mb-8">
        <p class="text-xl text-red-800 font-bold mb-4">
            Are you sure you want to delete:
        </p>
        <p class="text-2xl font-black text-gray-800 mb-4">
            "{{ post.title }}"
        </p>
        <p class="text-red-600 font-medium">
            This action cannot be undone! All comments and votes will be permanently deleted.
        </p>
    </div>

    <!-- Delete confirmation form -->
    <form method="post" class="flex gap-4 justify-center">
        {% csrf_token %}
        <button type="submit"
                class="px-8 py-4 bg-red-500 text-white rounded-lg font-black hover:bg-red-600 transition">
            Yes, Delete It
        </button>
        <a href="{% url 'post_detail' post.pk %}"
           class="px-8 py-4 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300 transition">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
